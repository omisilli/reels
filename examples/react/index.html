<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>reels — React example</title>
        <script>
            // Light or dark before the first paint: the switch's choice — one for
            // every example — or the system's.
            (() => {
                let choice = "system";
                try {
                    choice = localStorage.getItem("pg-example-scheme") || "system";
                } catch {}
                const dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.scheme = dark ? "dark" : "light";
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/main.tsx"></script>
    </body>
</html>
